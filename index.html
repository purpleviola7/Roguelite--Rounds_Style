        <strong>Controls:</strong> Move with <strong>A, D</strong> | Jump with <strong>W or Space</strong> | Aim with <strong>Mouse</strong> | Shoot with <strong>Left Click</strong> <br>
        Platforms block movement but projectiles slice through them. Fight through 5 evolving AI tiers.
    </div>

    function loadPersistentCurrency() {
      const saved = localStorage.getItem('plat_rogue_currency');
      const savedWins = localStorage.getItem('plat_rogue_wins');
      const savedLosses = localStorage.getItem('plat_rogue_losses');
      if (saved !== null) gState.currency = parseInt(saved, 10);
      if (savedWins !== null) gState.wins = parseInt(savedWins, 10);
      if (savedLosses !== null) gState.losses = parseInt(savedLosses, 10);
    }

    function savePersistentCurrency() {
      localStorage.setItem('plat_rogue_currency', gState.currency);
      localStorage.setItem('plat_rogue_wins', gState.wins);
      localStorage.setItem('plat_rogue_losses', gState.losses);
    }
    // =========================================================================
    // SECTION 3: RECYCLING PROJECTILE POOLS & CANVAS COORDINATE MAPPERS
    // =========================================================================
    class PooledBullet {
      constructor() {
        this.active = false; this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
        this.radius = 5; this.damage = 10; this.bouncesLeft = 0; this.pierceLeft = 0; this.isEnemy = false;
      }

      spawn(x, y, vx, vy, radius, damage, bounces, pierce, isEnemy) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.radius = radius; this.damage = damage;
        this.bouncesLeft = bounces; this.pierceLeft = pierce;
        this.isEnemy = isEnemy; this.active = true;
      }

      update(width, height) {
        if (!this.active) return;
        this.x += this.vx; this.y += this.vy;

        // Level boundary bounce collision processing
        if (this.x - this.radius < 0 || this.x + this.radius > width) {
          if (this.bouncesLeft > 0) { this.vx *= -1; this.bouncesLeft--; } else { this.active = false; }
        }
        if (this.y - this.radius < 0 || this.y + this.radius > height) {
          if (this.bouncesLeft > 0) { this.vy *= -1; this.bouncesLeft--; } else { this.active = false; }
        }
      }
    }

    class BulletPoolManager {
      constructor(size = 200) {
        this.pool = Array.from({ length: size }, () => new PooledBullet());
      }
      fetch(x, y, vx, vy, radius, damage, bounces, pierce, isEnemy) {
        const b = this.pool.find(bullet => !bullet.active);
        if (b) b.spawn(x, y, vx, vy, radius, damage, bounces, pierce, isEnemy);
      }
      update(width, height) {
        for (let i = 0; i < this.pool.length; i++) this.pool[i].update(width, height);
      }
      clear() {
        for (let i = 0; i < this.pool.length; i++) this.pool[i].active = false;
      }
    }

    const bulletPool = new BulletPoolManager();

    class InputTracker {
      constructor(canvas) {
        this.keys = {}; this.mouse = { x: 0, y: 0, isDown: false, clickedThisFrame: false };
        window.addEventListener('keydown', (e) => { this.keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { this.keys[e.key.toLowerCase()] = false; });
        canvas.addEventListener('mousemove', (e) => {
          const rect = canvas.getBoundingClientRect();
          this.mouse.x = e.clientX - rect.left; this.mouse.y = e.clientY - rect.top;
        });
        canvas.addEventListener('mousedown', () => { this.mouse.isDown = true; this.mouse.clickedThisFrame = true; });
        canvas.addEventListener('mouseup', () => { this.mouse.isDown = false; });
      }
      clearFrame() { this.mouse.clickedThisFrame = false; }
      isIntersecting(mx, my, bounds) {
        return mx >= bounds.x && mx <= bounds.x + bounds.w && my >= bounds.y && my <= bounds.y + bounds.h;
      }
    }
    // =========================================================================
    // SECTION 4: PLATFORMER ENTITY MOTIONS & BOUND BOX INTERSECTS
    // =========================================================================
    class BaseCharacter {
      constructor(x, y, color) {
        this.x = x; this.y = y; this.vx = 0; this.vy = 0;
        this.radius = 16; this.color = color;
        this.baseHp = 100; this.maxHp = 100; this.hp = 100;
        this.accel = 0.6; this.jumpForce = -9.5; this.maxSpeed = 4.5;
        this.angle = 0; this.grounded = false;

        this.baseDmg = 15; this.damage = 15; this.bulletRadius = 5; this.bulletSpeed = 9;
        this.fireCooldown = 0; this.baseFireInterval = 25; this.fireInterval = 25;
        this.bounces = 0; this.pierce = 0; this.lifesteal = 0; this.regenRate = 0;
        this.activeCards = [];
      }

      resetStats() {
        this.maxHp = this.baseHp; this.damage = this.baseDmg; this.bulletRadius = 5;
        this.bulletSpeed = 9; this.fireInterval = this.baseFireInterval;
        this.bounces = 0; this.pierce = 0; this.lifesteal = 0; this.regenRate = 0;

        this.activeCards.forEach(card => {
          this.damage *= card.dmg; this.bulletRadius *= card.size; this.bulletSpeed *= card.speed;
          this.maxHp *= card.hp; this.fireInterval *= card.fireRate; this.bounces += card.bnc;
          this.pierce += card.pierce; this.lifesteal += card.lifesteal; this.regenRate += card.regen;
        });
        this.hp = Math.min(this.hp, this.maxHp);
      }

      applyPhysicsUpdate() {
        this.vy += gState.gravity; // Continuous downward drag
        this.vx *= gState.friction; // Side slip deceleration

        this.x += this.vx;
        this.y += this.vy;
        this.grounded = false;

        // AABB Solid platform landing loop constraints
        platforms.forEach(plat => {
          if (this.x + this.radius > plat.x && this.x - this.radius < plat.x + plat.w) {
            // Is character falling downward through the surface point?
            if (this.y + this.radius >= plat.y && this.y - this.radius < plat.y && this.vy > 0) {
              this.y = plat.y - this.radius;
              this.vy = 0;
              this.grounded = true;
            }
          }
        });

        // Stage screen horizontal constraints
        if (this.x - this.radius < 0) { this.x = this.radius; this.vx = 0; }
        if (this.x + this.radius > gState.arenaWidth) { this.x = gState.arenaWidth - this.radius; this.vx = 0; }
      }

      takeDamage(amount) {
        this.hp = Math.max(0, this.hp - amount);
      }

      processRegen() {
        if (this.hp > 0 && this.hp < this.maxHp) this.hp = Math.min(this.maxHp, this.hp + this.regenRate);
      }

      shoot(pool, isEnemy) {
        if (this.fireCooldown <= 0) {
          const vx = Math.cos(this.angle) * this.bulletSpeed;
          const vy = Math.sin(this.angle) * this.bulletSpeed;
          pool.fetch(this.x, this.y, vx, vy, this.bulletRadius, this.damage, this.bounces, this.pierce, isEnemy);
          this.fireCooldown = this.fireInterval;
        }
      }

      tickCooldowns() { if (this.fireCooldown > 0) this.fireCooldown--; }
    }
    // =========================================================================
    // SECTION 5: PLATFORMING ADAPTIVE ACTION AI (LEVELS 1 - 20)
    // =========================================================================
    class PlatformerEnemyAI extends BaseCharacter {
      constructor(x, y, level) {
        super(x, y, '#e74c3c');
        this.level = Math.min(20, Math.max(1, level));
        this.applyLevelScaling();
      }

      applyLevelScaling() {
        const scalingFactor = 1 + (this.level - 1) * 0.12;
        this.baseHp *= scalingFactor;
        this.baseDmg *= (1 + (this.level - 1) * 0.08);
        this.maxSpeed += (this.level - 1) * 0.12;
        this.baseFireInterval = Math.max(7, this.baseFireInterval - (this.level - 1) * 1.1);
        this.resetStats();
        this.hp = this.maxHp;
      }

      thinkAndMove(player, frameCount) {
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.hypot(dx, dy);

        // Angle update running frame independently for ultra fluid targeting line
        this.angle = Math.atan2(dy, dx);

        if (frameCount % 6 !== 0) return; // Throttled movement path updates

        if (this.level <= 4) {
          // Level 1-4: Sloppy random patrolled navigation walk cycles
          if (Math.random() < 0.15) {
            this.vx += (Math.random() - 0.5) * this.maxSpeed;
          }
          if (Math.random() < 0.05 && this.grounded) {
            this.vy = this.jumpForce;
          }
        } 
        else if (this.level <= 12) {
          // Level 5-12: Directly tracks targets horizontally across platforms
          if (dx > 30) this.vx = Math.min(this.maxSpeed, this.vx + this.accel);
          else if (dx < -30) this.vx = Math.max(-this.maxSpeed, this.vx - this.accel);

          // Jump if target is higher or AI hits an edge barrier block
          if ((dy < -60 || Math.random() < 0.02) && this.grounded) {
            this.vy = this.jumpForce;
          }
        } 
        else {
          // Level 13-20: Advanced line-of-sight tracking and defensive jumps
          if (dx > 200) this.vx = Math.min(this.maxSpeed, this.vx + this.accel * 1.3);
          else if (dx < -200) this.vx = Math.max(-this.maxSpeed, this.vx - this.accel * 1.3);
          else {
            // Reposition backwards to keep spatial mid-range advantage
            this.vx += dx > 0 ? -this.accel : this.accel;
          }

          // Jump logic if target shoots or is vertical
          if ((dy < -40 || Math.abs(this.vx) < 0.2) && this.grounded && Math.random() < 0.4) {
            this.vy = this.jumpForce;
          }
        }
      }
    }
